# The Return on Thinking - methodology assumptions, version 1 (DRAFT for review)
# Every contestable number lives here. Bumping `version` REQUIRES restating the
# full back-series (CI will enforce from P2). Review notes for Allan inline.
version: 2
status: active   # v2: population-consistent attribution, F max-aggregator, Cs banded appropriability (adversarial review 2026-06-13)
# CHANGELOG 2026-08-11 (methods & data review -> research/reviews/return-on-thinking-methods-data-review-2026-08-11.md):
# oracle AI share mid 0.10->0.18; hyperscaler ai_capex_share mid 0.65->0.75 (Dell'Oro ~75%); adoption mid 0.15->0.20
# (band {0.12,0.20,0.32}, BTOS 21.5% firm-wtd / Census WP-26-25 32% empl-wtd); compensation pin 15.5->15.73tn (BEA 2025);
# occupations.csv employment+wages -> OEWS May-2025; AWS stated AI ARR $15bn->$25bn+ (Jassy 2026-07-30);
# GOOGL cloud base -> trailing-4q of the NEW quarterly segment series (self-refreshing). Back-series restated same run.
# CHANGELOG 2026-07-06: chips_servers depreciation mid recentred 0.28->0.20 on mid-2026 longer-life
# evidence (EV 'State of the AI Economy' 25 Jun 2026 + Meta 5.5yr + Nvidia 4-6yr + GPU rental yields).
# Band (low 0.18 / high 0.40) unchanged; back-series restated on the same run (movement stays real).

r:  # required return construction
  risk_free_fallback: 0.045   # used only if treasury_10y series unavailable
  erp_fallback: 0.043         # Damodaran implied ERP, mid-2026
  risk_free_series: treasury_10y          # primary; fred_dgs10 as cross-check
  equity_risk_premium_series: damodaran_implied_erp
  debt_spread_series: fred_baa10y         # when FRED is reachable
  baa_spread_fallback: 0.017              # Moody's Baa over 10y, mid-2026 (~1.7%); used if FRED series absent
  # v5: ACTIVE debt/equity split. Equity-funded K uses rf+ERP (~8.7% at mid-2026);
  # debt-funded uses rf+Baa spread (~6.2%). Per firm, the debt-funded weight is
  # trailing-4q debt issued / trailing-4q capex (clipped 0..1); the remainder
  # (internal + new equity) carries the equity required return. So a firm's blended
  # required return falls as it leans on debt - the neocloud edge's capital is
  # contractually cheaper (its EXTRA risk lives in F, not here).

delta:  # annual economic depreciation bands - THE contested numbers
  chips_servers:
    low: 0.18    # ~5.5yr life: the hyperscaler accounting view (10-K schedules)
    mid: 0.20    # ~5yr life: evidence-weighted central estimate (see REVIEW). Not the arithmetic midpoint.
    high: 0.40   # ~2.5yr life: the sceptics' view (Burry arithmetic) - retained as the fast-obsolescence tail
    # REVIEW 2026-07-06: mid recentred 0.28 -> 0.20 toward the longer-life evidence that accumulated through
    # mid-2026. Exponential View's report (25 Jun 2026) defends a 6-year life and shows GPU gross rental
    # YIELDS persisting past the 6-year mark - a market price of the user cost, exactly the discipline the
    # framework (value-coverage-framework.md S2) asks for. Meta extended server life to 5.5yr; Nvidia argues
    # 4-6yr from utilisation. The band still spans the controversy: low 0.18 = the ~6yr accounting view,
    # high 0.40 = Burry's 2-3yr replacement thesis (still live - he estimates a 4-6yr->2-3yr shift would cut
    # cumulative hyperscaler earnings >$176bn 2026-28; Amazon shortened a server subset 6->5yr). Mid is now an
    # evidence-weighted central estimate, deliberately asymmetric toward the low end - not the midpoint.
  buildings:
    low: 0.02
    mid: 0.025
    high: 0.03
    # REVIEW 2026-07-06: retained at the framework's 2-3% shell taxonomy. EV depreciates 'buildings/other
    # infrastructure' over 14yr (~0.071), but that lumps the real-estate shell with shorter-lived fit-out;
    # the shell alone is a 30-50yr asset, so the band stands.
  power_cooling_other:
    low: 0.03
    mid: 0.04
    high: 0.05
    # REVIEW 2026-07-06: reviewed against EV's 14yr non-chip figure and retained; the 0.03-0.05 band
    # (20-33yr) already spans realistic power/cooling equipment lives, and EV's 14yr is a lumped
    # shell+gear number, not a clean power/cooling input.

revenue_attribution:  # v3 - AI share of segment revenue for firms that don't state an AI ARR
  google_cloud_ai_share: {low: 0.15, mid: 0.25, high: 0.35}   # AI slice of Google Cloud (Vertex/Gemini/AI infra)
  oracle_cloud_ai_share: {low: 0.10, mid: 0.18, high: 0.26}   # REVIEW 2026-08-11: raised from {0.04,0.10,0.18}. FY2026 (reported 2026-06-10): OCI/IaaS $18.1bn +77% (Q4 +93%), RPO $638bn with the call attributing most of the Q3/Q4 RPO increase to "large scale AI contracts" (prepaid/customer-supplied GPUs); implied AI revenue $8-12bn = 16-24% of the FY2025 base this share applies to. Base is still the FMP FY2025 annual segment; RECHECK the share when FMP ingests the FY2026 10-K (segment re-cut).
  # neoclouds: total revenue used directly (pure-play AI); META excluded (AI monetized via ad uplift, no revenue line)

ai_capex_share:  # NEW v2 - fraction of each bucket's capex that is AI/data-centre, banded
  hyperscaler: {low: 0.55, mid: 0.75, high: 0.90}   # v5.2 2026-08-11: raised from {0.45,0.65,0.85} - Dell'Oro (10 Jun 2026): 2026 global DC capex >$1tn and ~75% of hyperscaler capex is AI infrastructure (~$450bn); MSFT FY26Q4: 'roughly 2/3 of our CapEx was for short-lived assets' + DC shells/leases on top; big-4 2026 capex guidance $720-745bn (AMZN ~$220bn, GOOGL $195-205bn, META $130-145bn, MSFT ~$175-190bn est). SemiAnalysis calibration still pending; prior note (v5, +78% YoY) retained in git history.
  neocloud: {low: 0.95, mid: 1.0, high: 1.0}        # neocloud capex is essentially all AI compute

k_allocation:  # share of AI capex by asset class (until SemiAnalysis calibration)
  hyperscaler: {chips_servers: 0.60, buildings: 0.25, power_cooling_other: 0.15}
  neocloud:    {chips_servers: 0.75, buildings: 0.15, power_cooling_other: 0.10}
  # REVIEW: crude; flagged for replacement by Accelerator-Model vintages if SemiAnalysis grants access.

quasi_rent_margin:  # converts AI revenues to quasi-rents: revenue net of OPERATING costs only
  # (energy, labour, inference, sales). Depreciation is NOT netted here - it is charged
  # in the user-cost denominator; netting it twice would double-count (adversarial review
  # catch, 2026-06-12). m is therefore an EBITDA-type margin, not an EBIT margin.
  low: 0.30
  mid: 0.50
  high: 0.70
  # REVIEW: widest band in the system; inference-margin estimates are disputed.

cs:
  horizons_years: [10, 30]
  rct_coefficients:  # frozen until annual review; sources in METHODS.md
    noy_zhang_2023:   {time_saving: 0.40, quality: 0.18}
    brynjolfsson_li_raymond_2025: {productivity: 0.15}
    dellacqua_2023:   {tasks: 0.122, speed: 0.251}
    cui_2026:         {dev_tasks: 0.26}

map:
  movement_rule: "a move is called only when the new quarterly position lies outside the previous quarter's uncertainty ellipse"
  trail_quarters: 4

calibration_credits:
  - "SemiAnalysis (pending response to research-access request, 2026-06-12)"

cs_macro:  # social-return inputs - bounded estimate, every figure sourced. v2 replaces with live collectors.
  us_employee_compensation_usd: 15730000000000   # ~$15.73tn 2025 annual, BEA NIPA compensation of employees (FRED COE quarterly: 15,510.9/15,610.3/15,836.9/15,949.6; Q2-2026 16,230 SAAR); refreshed 2026-08-11 from the 15.5tn pin
  ai_exposed_task_share: {low: 0.20, mid: 0.30, high: 0.45}   # AEI augmentation/automation task coverage
  rct_effect: {low: 0.15, mid: 0.27, high: 0.40}   # task-share-weighted productivity effect on affected tasks; mid 0.27 = central of the AEI-share-weighted RCT mean 0.26-0.30 (Cui +26%, Noy-Zhang -40%t, Brynjolfsson +14%, Dell'Acqua +12%, weighted by AEI occupation share) - see data/curated/rct_effects.csv; low/high span the lab->field discount and the throughput-optimistic read
  adoption_rate: {low: 0.12, mid: 0.20, high: 0.32}   # v5.2 2026-08-11: BTOS 'any business function' = 21.5% (period 202615, late Jul 2026; expect-in-6m 24.3%; pre-break production-use question discontinued) - the old mid 0.15 sat BELOW the observed firm-weighted floor. Employment-weighted runs ~1.8-2.3x firm-weighted: Census WP-26-25/NBER w35141 (BTOS AI supplement): 18% firm-weighted -> 32% employment-weighted (worker-task use 23%->41%); Fed RPS individual work use ~41-43%. low 0.12 = firm-weighted floor, mid 0.20 = current firm-weighted reading, high 0.32 = employment-weighted. Cs multiplies a WAGE BILL, so employment-weighting is arguably the correct concept - kept as the HIGH, not the mid (conservative; revisit at v6).
  appropriability_to_society: {low: 0.50, mid: 0.70, high: 0.90}   # v2 - banded (was fixed 0.85); social share of gross productivity value
  discount_rate: 0.05
  annual_growth: {low: 0.0, mid: 0.06, high: 0.12}   # v2 - tamed (was up to 0.20); 30y horizon is illustrative only

fragility:  # F index - v2: weakest-link (max of centre vs edge), not a weighted average
  aggregator: max                   # v2 - F = max(centre, edge) + circularity; a blend hid the edge risk
  circularity_bonus: 0.15           # circular deals add up to this on top of the max
  circularity_full_at: 10           # v6 2026-07-06: raised 6->10 so a single circular deal cannot tip the headline; circular deals are now common (4 by mid-2026), so "full circularity" is a higher bar. Each flag now = +0.015.
  stage_thresholds: {hedge: 0.33, speculative: 0.75}   # hedge=green(cash); speculative=amber(rolling); ponzi=red(wholly external)
